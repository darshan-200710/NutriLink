services:
  # Backend FastAPI
  - type: web
    name: nutrisnap-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

  # Frontend React/Vite
  - type: web
    name: nutrisnap-frontend
    runtime: static
    buildCommand: cd essential-screens && npm install --legacy-peer-deps && npm run build
    staticPublishPath: essential-screens/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://nutrisnap-backend.onrender.com
